<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1A2642"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Estação 1"/>
  <title>Estação de Resíduos 1</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#F2F4F8;font-family:'DM Sans',sans-serif}
    body{max-width:480px;margin:0 auto;padding-bottom:90px;overflow-x:hidden}
    .header{background:linear-gradient(135deg,#1A2642 0%,#243357 100%);padding:max(52px,calc(env(safe-area-inset-top)+20px)) 24px 24px;color:#FFF;position:relative;overflow:hidden}
    .header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.04)}
    .header::after{content:'';position:absolute;bottom:-20px;left:60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.03)}
    .header-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
    .header-subtitle{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
    .header-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px}
    .btn-historico{background:rgba(255,255,255,.12);border:none;color:#FFF;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
    .resumo{display:flex;gap:12px;margin-top:20px;position:relative;z-index:1}
    .resumo-card{flex:1;background:rgba(255,255,255,.10);border-radius:14px;padding:12px 14px}
    .resumo-label{font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1px}
    .resumo-num{font-size:24px;font-weight:800;margin-top:2px}
    .resumo-sub{font-size:14px;font-weight:400;color:rgba(255,255,255,.6)}
    .sync-badge{font-size:10px;color:rgba(255,255,255,.4);margin-top:8px;position:relative;z-index:1}
    .alerta{margin:16px 16px 0;background:#FFF3CD;border:1.5px solid #F0C040;border-radius:14px;padding:12px 16px;display:none;align-items:flex-start;gap:10px}
    .alerta.visivel{display:flex}
    .tabs{display:flex;margin:16px 16px 0;background:#E4E8F0;border-radius:14px;padding:4px}
    .tab-btn{flex:1;padding:10px;border-radius:11px;border:none;background:transparent;color:#888;font-weight:500;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
    .tab-btn.active{background:#FFF;color:#1A2642;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.10)}
    .content{padding:16px 16px 0}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .card-especial{background:#FFF;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:5px solid #CCC}
    .card-especial.cheio{box-shadow:0 0 0 2px #D9534F30,0 2px 12px rgba(0,0,0,.08)}
    .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .card-info{display:flex;align-items:center;gap:10px}
    .card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .card-nome{font-weight:700;color:#1A1F2E;font-size:15px}
    .card-ts{font-size:11px;color:#AAA}
    .card-pct{font-weight:800;font-size:22px}
    .card-nivel{font-size:11px;font-weight:600;text-align:right}
    .barra-wrap{width:100%;background:#F0F0F0;border-radius:8px;height:14px;overflow:hidden}
    .barra-fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .btn-registar{margin-top:12px;width:100%;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
    .rsu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card-rsu{background:#FFF;border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    .card-rsu.cheio{box-shadow:0 0 0 2px #D9534F30,0 2px 12px rgba(0,0,0,.08)}
    .rsu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .rsu-icon{width:34px;height:34px;border-radius:9px;background:#EEF0F8;display:flex;align-items:center;justify-content:center;font-size:18px}
    .rsu-pct{font-weight:800;font-size:20px;color:#3B4A7A}
    .rsu-pct.cheio{color:#D9534F}
    .rsu-nome{font-weight:700;color:#1A1F2E;font-size:15px}
    .rsu-nivel{font-size:11px;font-weight:600;margin-bottom:8px}
    .rsu-ts{font-size:10px;color:#CCC;margin-top:6px}
    .btn-rsu{margin-top:10px;width:100%;padding:8px;border-radius:9px;border:1.5px solid #E8EAF4;background:#F4F5FB;color:#5E6BBA;font-weight:700;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
    .modal-overlay{position:fixed;inset:0;background:rgba(10,14,20,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal-sheet{background:#FFF;border-radius:24px 24px 0 0;padding:28px 24px max(36px,calc(env(safe-area-inset-bottom)+20px));width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:90vh;overflow-y:auto}
    .modal-overlay.open .modal-sheet{transform:translateY(0)}
    .modal-handle{width:40px;height:4px;background:#DDD;border-radius:4px;margin:0 auto 20px}
    .modal-titulo{font-weight:700;font-size:18px;color:#1A1F2E;margin-bottom:4px}
    .modal-sub{color:#666;font-size:14px;margin-bottom:24px}
    .slider-row{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
    .slider-label{font-weight:600;color:#333;font-size:14px}
    .slider-valor{font-weight:800;font-size:22px}
    input[type=range]{width:100%;height:6px;cursor:pointer}
    .slider-ticks{display:flex;justify-content:space-between;font-size:11px;color:#AAA;margin-top:4px}
    .atalhos{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
    .btn-atalho{padding:6px 14px;border-radius:20px;border:2px solid #E0E0E0;background:#FFF;color:#555;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
    .btn-atalho.sel{border-color:var(--cor);background:var(--cor);color:#FFF}
    textarea{width:100%;min-height:70px;border-radius:12px;border:1.5px solid #E0E0E0;padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;resize:none;color:#333;outline:none}
    .modal-btns{display:flex;gap:12px;margin-top:20px}
    .btn-cancelar{flex:1;padding:14px;border-radius:14px;border:none;background:#F0F0F0;color:#555;font-weight:700;font-size:15px;cursor:pointer;font-family:'DM Sans',sans-serif}
    .btn-guardar{flex:2;padding:14px;border-radius:14px;border:none;color:#FFF;font-weight:700;font-size:15px;cursor:pointer;font-family:'DM Sans',sans-serif}
    .hist-item{padding:12px 16px;background:#F8F8F8;border-radius:12px;margin-bottom:10px}
    .hist-top{display:flex;justify-content:space-between;align-items:center}
    .hist-vazio{color:#AAA;text-align:center;padding:40px 0;font-size:15px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1A2642;color:#FFF;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:2000;transition:transform .3s cubic-bezier(.4,0,.2,1);white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .badge-offline{display:none;position:fixed;top:12px;right:12px;z-index:500;background:#D9534F;color:#FFF;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700}
    .badge-offline.visivel{display:block}
  </style>

<body>
<div class="badge-offline" id="badgeOffline">✈️ Offline</div>
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-subtitle">Estação de Transferência</div>
      <div class="header-title">Gestão de Resíduos — Est. 1</div>
    </div>
    <button class="btn-historico" onclick="abrirHistorico()">📋 Histórico</button>
  </div>
  <div class="resumo">
    <div class="resumo-card"><div class="resumo-label">Especiais</div><div class="resumo-num"><span id="resCheiasEsp">0</span><span class="resumo-sub">/7 cheios</span></div></div>
    <div class="resumo-card"><div class="resumo-label">RSU</div><div class="resumo-num"><span id="resCheiasRSU">0</span><span class="resumo-sub">/6 cheios</span></div></div>
  </div>
  <div class="sync-badge" id="syncBadge">⏳ A ligar ao servidor...</div>
</div>
<div class="alerta" id="alertaDiv">
  <span style="font-size:20px;flex-shrink:0">⚠️</span>
  <div><div style="font-weight:700;color:#7A5C00;font-size:13px">Depósitos a necessitar recolha</div><div style="color:#9A7800;font-size:12px;margin-top:2px" id="alertaLista"></div></div>
</div>
<div class="tabs">
  <button class="tab-btn active" id="tabEspeciais" onclick="mudarTab('especiais')">🗂️ Especiais</button>
  <button class="tab-btn" id="tabRsu" onclick="mudarTab('rsu')">🗑️ RSU</button>
</div>
<div class="content">
  <div class="tab-panel active" id="panelEspeciais"></div>
  <div class="tab-panel" id="panelRsu"></div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-titulo">Registar Enchimento</div>
    <div class="modal-sub" id="modalSub"></div>
    <div><div class="slider-row"><span class="slider-label">Nível de enchimento</span><span class="slider-valor" id="sliderVal" style="color:#555">0%</span></div>
    <input type="range" id="slider" min="0" max="100" step="5" value="0" oninput="atualizarSlider(this.value)"/>
    <div class="slider-ticks"><span>0%</span><span>50%</span><span>100%</span></div></div>
    <div class="atalhos" id="atalhos"></div>
    <textarea id="notaInput" placeholder="Nota opcional (ex: recolha pendente, avaria...)"></textarea>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-guardar" id="btnGuardar" onclick="guardarRegisto()">Guardar</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalHistorico" onclick="fecharHistorico(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()" style="max-height:80vh">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-titulo" style="margin:0">Histórico de Registos</div>
      <button onclick="exportarCSV()" style="background:#F0F0F0;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">⬇️ CSV</button>
    </div>
    <div id="historicoLista"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const ESTACAO_ID = 'est1';
const LOCAL_KEY  = 'estacao_residuos_v1';
const RSU_COUNT  = 6;

const ESPECIAIS = [
  {id:'madeiras',        nome:'Madeiras',            emoji:'🪵',cor:'#8B5E3C',corClaro:'#F5EDE5'},
  {id:'verdes',          nome:'Verdes',              emoji:'🌿',cor:'#3A7D44',corClaro:'#E6F4E9'},
  {id:'papel',           nome:'Papel',               emoji:'📄',cor:'#4A90D9',corClaro:'#E5F0FB'},
  {id:'plasticos_emb',   nome:'Plást. Embalagens',   emoji:'🧴',cor:'#E6A817',corClaro:'#FEF6E0'},
  {id:'plasticos_rijos', nome:'Plást. Rijos',        emoji:'🪣',cor:'#D46A1A',corClaro:'#FAEEE3'},
  {id:'monstros',        nome:'Monstros',            emoji:'🛋️',cor:'#7B5EA7',corClaro:'#F0EAF8'},
  {id:'vidro',           nome:'Vidro',               emoji:'🫙',cor:'#2E9C8A',corClaro:'#E3F5F3'},
];

// Firebase
const firebaseConfig = {
  apiKey:'AIzaSyA5Lzaiqm_4lTeMWed7paM922zq6tmpXEs',
  authDomain:'residuos-dac52.firebaseapp.com',
  databaseURL:'https://residuos-dac52-default-rtdb.europe-west1.firebasedatabase.app',
  projectId:'residuos-dac52',
  storageBucket:'residuos-dac52.firebasestorage.app',
  messagingSenderId:'877529109216',
  appId:'1:877529109216:web:98c8fb2d320c3cd257f685'
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Estado
function estadoInicial() {
  const esp={};
  ESPECIAIS.forEach(d=>esp[d.id]={percentagem:0,ultimoRegisto:null});
  const rsu={};
  for(let i=1;i<=RSU_COUNT;i++) rsu[`rsu_${i}`]={percentagem:0,ultimoRegisto:null};
  return {especiais:esp,rsu,historico:[]};
}
function carregar() {
  try{const s=localStorage.getItem(LOCAL_KEY);if(s)return JSON.parse(s);}catch{}
  return estadoInicial();
}
let estado = carregar();
let modalAtual = null;
let tabAtual = 'especiais';

function guardar() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(estado));
  if(navigator.onLine){
    db.ref('estacoes/'+ESTACAO_ID).set({
      especiais:estado.especiais,
      rsu:estado.rsu,
      ultimaAtualizacao:Date.now()
    }).catch(()=>{});
  }
}

// Sync em tempo real
db.ref('estacoes/'+ESTACAO_ID).on('value', snapshot=>{
  const data=snapshot.val();
  if(data&&data.especiais&&data.rsu){
    estado.especiais=data.especiais;
    estado.rsu=data.rsu;
    localStorage.setItem(LOCAL_KEY,JSON.stringify(estado));
    render();
    document.getElementById('syncBadge').textContent='🟢 Sincronizado — '+fmtNow();
  }
});

function fmtNow(){
  return new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
}

// Helpers
function getNivel(pct){
  if(pct>=90)return{label:'CHEIO',color:'#D9534F'};
  if(pct>=70)return{label:'ALTO',color:'#E6A817'};
  if(pct>=40)return{label:'MÉDIO',color:'#4A90D9'};
  return{label:'BAIXO',color:'#3A7D44'};
}
function formatDate(ts){
  if(!ts)return'';
  return new Date(ts).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function barraHTML(pct,cor){
  const fill=pct>=90?'#D9534F':pct>=70?'#E6A817':cor;
  return`<div class="barra-wrap"><div class="barra-fill" style="width:${pct}%;background:${fill}"></div></div>`;
}

// Render
function render(){renderEspeciais();renderRSU();renderResumo();renderAlerta();}

function renderEspeciais(){
  document.getElementById('panelEspeciais').innerHTML=ESPECIAIS.map(dep=>{
    const d=estado.especiais[dep.id]||{percentagem:0,ultimoRegisto:null};
    const nv=getNivel(d.percentagem);
    return`<div class="card-especial ${d.percentagem>=90?'cheio':''}" style="border-left-color:${dep.cor}">
      <div class="card-top">
        <div class="card-info">
          <div class="card-icon" style="background:${dep.corClaro}">${dep.emoji}</div>
          <div><div class="card-nome">${dep.nome}</div>${d.ultimoRegisto?`<div class="card-ts">Atualizado ${formatDate(d.ultimoRegisto)}</div>`:''}</div>
        </div>
        <div><div class="card-pct" style="color:${d.percentagem>=90?'#D9534F':dep.cor}">${d.percentagem}%</div><div class="card-nivel" style="color:${nv.color}">${nv.label}</div></div>
      </div>
      ${barraHTML(d.percentagem,dep.cor)}
      <button class="btn-registar" style="border:1.5px solid ${dep.cor}30;background:${dep.corClaro};color:${dep.cor}" onclick="abrirModal('especial','${dep.id}')">+ Registar Enchimento</button>
    </div>`;
  }).join('');
}

function renderRSU(){
  let html='<div class="rsu-grid">';
  for(let i=1;i<=RSU_COUNT;i++){
    const id=`rsu_${i}`;
    const d=estado.rsu[id]||{percentagem:0,ultimoRegisto:null};
    const nv=getNivel(d.percentagem);
    html+=`<div class="card-rsu ${d.percentagem>=90?'cheio':''}">
      <div class="rsu-top"><div class="rsu-icon">🗑️</div><div class="rsu-pct ${d.percentagem>=90?'cheio':''}">${d.percentagem}%</div></div>
      <div class="rsu-nome">RSU #${i}</div>
      <div class="rsu-nivel" style="color:${nv.color}">${nv.label}</div>
      ${barraHTML(d.percentagem,'#5E6BBA')}
      ${d.ultimoRegisto?`<div class="rsu-ts">${formatDate(d.ultimoRegisto)}</div>`:''}
      <button class="btn-rsu" onclick="abrirModal('rsu','${id}')">+ Registar</button>
    </div>`;
  }
  document.getElementById('panelRsu').innerHTML=html+'</div>';
}

function renderResumo(){
  document.getElementById('resCheiasEsp').textContent=ESPECIAIS.filter(d=>(estado.especiais[d.id]?.percentagem||0)>=90).length;
  let cr=0;for(let i=1;i<=RSU_COUNT;i++)if((estado.rsu[`rsu_${i}`]?.percentagem||0)>=90)cr++;
  document.getElementById('resCheiasRSU').textContent=cr;
}

function renderAlerta(){
  const al=[];
  ESPECIAIS.forEach(d=>{if((estado.especiais[d.id]?.percentagem||0)>=90)al.push(d.nome);});
  for(let i=1;i<=RSU_COUNT;i++)if((estado.rsu[`rsu_${i}`]?.percentagem||0)>=90)al.push(`RSU #${i}`);
  const div=document.getElementById('alertaDiv');
  if(al.length>0){div.classList.add('visivel');document.getElementById('alertaLista').textContent=al.join(' · ');}
  else div.classList.remove('visivel');
}

// Tabs
function mudarTab(t){
  tabAtual=t;
  document.getElementById('tabEspeciais').classList.toggle('active',t==='especiais');
  document.getElementById('tabRsu').classList.toggle('active',t==='rsu');
  document.getElementById('panelEspeciais').classList.toggle('active',t==='especiais');
  document.getElementById('panelRsu').classList.toggle('active',t==='rsu');
}

// Modal
function abrirModal(tipo,id){
  modalAtual={tipo,id};
  const pct=tipo==='especial'?estado.especiais[id]?.percentagem||0:estado.rsu[id]?.percentagem||0;
  const dep=tipo==='especial'?ESPECIAIS.find(d=>d.id===id):null;
  const cor=dep?dep.cor:'#5E6BBA';
  const nome=dep?dep.nome:`RSU #${id.split('_')[1]}`;
  document.getElementById('modalSub').textContent=nome;
  document.getElementById('slider').value=pct;
  document.getElementById('slider').style.accentColor=cor;
  document.getElementById('sliderVal').textContent=pct+'%';
  document.getElementById('sliderVal').style.color=cor;
  document.getElementById('notaInput').value='';
  document.getElementById('btnGuardar').style.background=cor;
  document.getElementById('btnGuardar').style.boxShadow=`0 4px 16px ${cor}55`;
  renderAtalhos(pct,cor);
  document.getElementById('modalOverlay').classList.add('open');
}
function renderAtalhos(sel,cor){
  document.getElementById('atalhos').innerHTML=[25,50,75,90,100].map(v=>
    `<button class="btn-atalho ${v==sel?'sel':''}" style="--cor:${cor}" onclick="selecionarAtalho(${v},'${cor}')">${v}%</button>`
  ).join('');
}
function selecionarAtalho(v,cor){document.getElementById('slider').value=v;atualizarSlider(v,cor);}
function atualizarSlider(val,cor){
  if(!cor){const dep=modalAtual?.tipo==='especial'?ESPECIAIS.find(d=>d.id===modalAtual.id):null;cor=dep?dep.cor:'#5E6BBA';}
  document.getElementById('sliderVal').textContent=val+'%';
  document.getElementById('sliderVal').style.color=cor;
  renderAtalhos(Number(val),cor);
}
function fecharModal(e){
  if(e&&e.target!==document.getElementById('modalOverlay'))return;
  document.getElementById('modalOverlay').classList.remove('open');
  modalAtual=null;
}
function guardarRegisto(){
  const pct=Number(document.getElementById('slider').value);
  const nota=document.getElementById('notaInput').value.trim();
  const{tipo,id}=modalAtual;
  const dep=tipo==='especial'?ESPECIAIS.find(d=>d.id===id):null;
  const nome=dep?dep.nome:`RSU #${id.split('_')[1]}`;
  if(tipo==='especial'){estado.especiais[id]={percentagem:pct,ultimoRegisto:Date.now()};}
  else{estado.rsu[id]={percentagem:pct,ultimoRegisto:Date.now()};}
  estado.historico.push({deposito:nome,percentagem:pct,nota,timestamp:Date.now()});
  guardar();
  render();
  document.getElementById('modalOverlay').classList.remove('open');
  modalAtual=null;
  mostrarToast('✅ Registo guardado');
}

// Histórico
function abrirHistorico(){
  const lista=document.getElementById('historicoLista');
  const hist=[...estado.historico].reverse();
  lista.innerHTML=hist.length===0?'<div class="hist-vazio">Sem registos ainda.</div>':hist.map(r=>{
    const nv=getNivel(r.percentagem);
    return`<div class="hist-item" style="border-left:4px solid ${nv.color}">
      <div class="hist-top"><span style="font-weight:700;color:#333;font-size:15px">${r.deposito}</span><span style="font-weight:800;font-size:16px;color:${nv.color}">${r.percentagem}%</span></div>
      ${r.nota?`<div style="color:#666;font-size:13px;margin-top:4px">📝 ${r.nota}</div>`:''}
      <div style="color:#AAA;font-size:12px;margin-top:4px">${formatDate(r.timestamp)}</div>
    </div>`;
  }).join('');
  document.getElementById('modalHistorico').classList.add('open');
}
function fecharHistorico(e){
  if(e&&e.target!==document.getElementById('modalHistorico'))return;
  document.getElementById('modalHistorico').classList.remove('open');
}
function exportarCSV(){
  const linhas=['Depósito,Percentagem,Nota,Data'];
  estado.historico.forEach(r=>linhas.push(`"${r.deposito}",${r.percentagem},"${r.nota||''}","${formatDate(r.timestamp)}"`));
  const blob=new Blob([linhas.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`registos_est1_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  mostrarToast('📥 CSV exportado');
}

// Toast
let toastTimer;
function mostrarToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// Offline
function atualizarOffline(){document.getElementById('badgeOffline').classList.toggle('visivel',!navigator.onLine);}
window.addEventListener('online',()=>{atualizarOffline();guardar();mostrarToast('🌐 Online — a sincronizar...');});
window.addEventListener('offline',()=>{atualizarOffline();mostrarToast('✈️ Offline — dados guardados localmente');});
atualizarOffline();

// Service Worker
if('serviceWorker' in navigator){
  const sw=`const C='est1-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([self.registration.scope])));self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(e.request))));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

render();
</script>
</body>
</html>
